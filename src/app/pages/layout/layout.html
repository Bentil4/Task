<div class="app-shell">
  <app-sidebar (hideSidebar)="onHideSidebar()"></app-sidebar>

  <div class="app-content">
    <app-header 
      [title]="boardTitle()" 
      [currentFilter]="filterStatus() || ''"
      (addTask)="onAddNewTask($event)"
      (filterChange)="onFilterChange($event)"
    ></app-header>
    <app-board 
      [boardId]="boardId()" 
      [filterStatus]="filterStatus()" 
      [sortBy]="sortBy()" 
      (addColumn)="onAddNewColumn($event)"
    ></app-board>
  </div>
</div>
