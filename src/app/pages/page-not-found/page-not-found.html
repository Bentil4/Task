<div class="not-found">
  <div class="not-found__container">
    <div class="not-found__content">
      <div class="not-found__icon">
        <div class="not-found__number">404</div>
      </div>
      
      <div class="not-found__text">
        <h1 class="not-found__title">Page Not Found</h1>
        <p class="not-found__message">
          The page you're looking for doesn't exist or has been moved.
        </p>
      </div>
      
      <div class="not-found__actions">
        <app-button variant="primary" (clicked)="onNavigateToHome($event)">
          Go Back Home
        </app-button>
      </div>
    </div>
    
    <div class="not-found__illustration">
      <div class="not-found__shapes">
        <div class="not-found__shape not-found__shape--1"></div>
        <div class="not-found__shape not-found__shape--2"></div>
        <div class="not-found__shape not-found__shape--3"></div>
      </div>
    </div>
  </div>
</div>
