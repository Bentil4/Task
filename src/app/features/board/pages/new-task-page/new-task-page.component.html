<div class="page-overlay">
  <div class="page-content">
    <nav class="breadcrumb">
      <a class="breadcrumb-link" (click)="navigateToBoard()">← Back to Board</a>
    </nav>
    <app-add-task-form
      [boardId]="boardId()"
      [isSubmitting]="isSubmitting()"
      (taskCreated)="onTaskCreated($event)"
      (canceled)="onCancel()"
    />
  </div>
</div>
