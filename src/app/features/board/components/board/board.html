<main class="board" role="main">
  @if (columns && columns.length > 0) {
    <div class="board__columns" cdkDropListGroup>
      @for (column of columns; track column.name) {
        <section class="board__column">
          <h2 class="board__column-title">{{ column.name }} ({{ column.tasks.length }})</h2>
          <div
            class="board__cards"
            cdkDropList
            [cdkDropListData]="column.tasks"
            (cdkDropListDropped)="drop($event)"
          >
            @for (task of column.tasks; track task.title; let idx = $index) {
              <app-board-card 
                [card]="task" 
                [taskIndex]="idx"
                (cardClick)="onTaskClick($event)"
                cdkDrag
              ></app-board-card>
            }
          </div>
        </section>
      }
    </div>
  } @else {
    <div class="board__empty">
      <p class="board__message">This board is empty. Create a new column to get started.</p>
    </div>
  }
</main>
