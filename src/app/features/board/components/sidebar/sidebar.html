<aside class="sidebar" role="navigation" aria-label="Main sidebar" [class.sidebar--hidden]="hidden()">
  <div class="sidebar__brand">
    <img [src]="logoSource()" alt="Kanban logo" />
  </div>

  <div class="sidebar__boards">
    <div class="sidebar__label">ALL BOARDS ({{ boards().length }})</div>
    <ul class="sidebar__list">
      @for (board of boards(); track board.id) {
        <li class="sidebar__item">
          <a [routerLink]="['/board', board.id]" routerLinkActive="sidebar__item--active" class="sidebar__link">
            <img src="assets/icon-board.svg" alt="Board icon" />
            <p>{{ board.name }}</p>
          </a>
        </li>
      }
    </ul>
    <button class="sidebar__create" (click)="onCreateNewBoard()" aria-label="Create new board">
      <img src="assets/icon-board.svg" alt="Add task icon" />
      <span>+ Create New Board</span>
    </button>
  </div>

  <div class="sidebar__footer">
    <div class="sidebar__theme" role="group" aria-label="Theme selector">
      <img src="assets/icon-light-theme.svg" alt="Light theme icon" />
      <label class="sidebar__theme-toggle">
        <input 
          type="checkbox" 
          [checked]="themeService.theme() === 'dark'"
          (change)="onThemeToggle($event)"
          aria-label="Toggle theme"
        />
        <span class="sidebar__theme-slider"></span>
      </label>
      <img src="assets/icon-dark-theme.svg" alt="Dark theme icon" />
    </div>

    <button
      class="sidebar__settings"
      routerLink="/settings"
      routerLinkActive="sidebar__settings--active"
      aria-label="Settings"
      title="Settings"
    >
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.43 10.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C12.46.19 12.25 0 12 0h-4c-.25 0-.46.19-.49.44l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.25.24.44.49.44h4c.25 0 .46-.19.49-.44l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM10 13c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3z"/>
      </svg>
    <p>Settings</p>

    </button>

    <button
      class="sidebar__toggle"
      (click)="hide.emit()"
      aria-label="Hide Sidebar"
    >
      <img src="assets/icon-hide-sidebar.svg" alt="Hide sidebar icon" />
      <p class="sidebar__toggle-text">Hide Sidebar</p>
    </button>
  </div>
</aside>
