<section class="edit-task-form">
  <h2 class="form-title">Edit Task</h2>

  <div class="form-group">
    <app-input
      label="Title"
      placeholder="e.g. Take coffee break"
      [value]="title()"
      (valueChange)="title.set($event)"
      [required]="true"
    />
  </div>

  <div class="form-group">
    <app-textarea
      label="Description"
      placeholder="e.g. It's always good to take a break. This 15 minute break will recharge the batteries a little."
      [value]="description()"
      [rows]="4"
      (valueChange)="description.set($event)"
    />
  </div>

  <div class="form-group">
    <label class="section-label">Subtasks</label>

    @for (subtask of subtasks(); track subtask.id) {
      <div class="subtask-row">
        <app-input
          placeholder="e.g. Make coffee"
          [value]="subtask.title"
          (valueChange)="updateSubtask(subtask.id, $event)"
        />
        <button
          type="button"
          class="remove-button"
          (click)="removeSubtask(subtask.id)"
          aria-label="Remove subtask"
        >
          <svg width="15" height="15" xmlns="http://www.w3.org/2000/svg">
            <g fill="#828FA3" fill-rule="evenodd">
              <path d="m12.728 0 2.122 2.122L2.122 14.85 0 12.728z" />
              <path d="M0 2.122 2.122 0 14.85 12.728l-2.122 2.122z" />
            </g>
          </svg>
        </button>
      </div>
    }

    <button type="button" class="add-subtask-button" (click)="addSubtask()">
      + Add New Subtask
    </button>
  </div>

  <div class="form-group">
    <app-select
      label="Status"
      [options]="statusOptions()"
      [value]="status()"
      (valueChange)="status.set($event)"
    />
  </div>

  <button type="button" class="submit-button" (click)="onSubmit()">Save Changes</button>
</section>
