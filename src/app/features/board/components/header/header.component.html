<header class="header">
  <div class="header__left">
    <button class="header__menu-btn" (click)="menuToggle.emit()" aria-label="Toggle menu">
      <svg width="16" height="11" xmlns="http://www.w3.org/2000/svg">
        <g fill="#828FA3" fill-rule="evenodd">
          <rect width="16" height="2" rx="1"/>
          <rect y="4.5" width="16" height="2" rx="1"/>
          <rect y="9" width="16" height="2" rx="1"/>
        </g>
      </svg>
    </button>
    <h1 class="header__title">{{ title() }}</h1>
  </div>
  <section class="header__actions">
    <div class="header__filter">
      <label for="status-filter" class="header__filter-label">Filter:</label>
      <select
        id="status-filter"
        class="header__filter-select"
        (change)="onFilterChange($event)"
        [value]="currentFilter()"
      >
        <option value="">All</option>
        <option value="Todo">Todo</option>
        <option value="Doing">Doing</option>
        <option value="Done">Done</option>
      </select>
    </div>
    <app-button  ariaLabel="Add New Task" (clicked)="onAddTask()">
      <span class="btn-text">+ Add New Task</span>
      <span class="btn-icon">+</span>
    </app-button>
    <div class="header__menu-wrapper">
      <button class="header__more" (click)="toggleMenu()" aria-label="More options">
        <img src="assets/icon-vertical-ellipsis.svg" alt="vertical-ellipsis" />
      </button>
      @if (isMenuOpen()) {
        <div class="header__dropdown">
          <button class="header__dropdown-item header__dropdown-item--edit" (click)="openEditBoard()">
            Edit Board
          </button>
          <button class="header__dropdown-item header__dropdown-item--delete" (click)="deleteBoard()">
            Delete Board
          </button>
        </div>
      }
    </div>
  </section>
</header>

@if (isEditingBoard()) {
  <div class="header__modal-overlay" (click)="cancelEditBoard()">
    <div class="header__modal" (click)="$event.stopPropagation()">
      <h2 class="header__modal-title">Edit Board</h2>
      <form (ngSubmit)="saveEditBoard()" class="header__form">
        <div class="header__form-group">
          <label for="board-name" class="header__form-label">Board Name</label>
          <input
            id="board-name"
            type="text"
            class="header__form-input"
            [(ngModel)]="editBoardName"
            name="boardName"
            placeholder="Enter board name"
            required
          />
        </div>
        <div class="header__form-actions">
          <button type="submit" class="header__form-btn header__form-btn--save">
            Save Changes
          </button>
          <button type="button" class="header__form-btn header__form-btn--cancel" (click)="cancelEditBoard()">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
}
