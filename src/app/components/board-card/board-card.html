<article class="card" role="article" tabindex="0">
  <h3 class="card__title">{{ card().title }}</h3>
  @if (card().commitMessage) {
    <p class="card__commit">{{ card().commitMessage }}</p>
  }
  <div class="card__meta">
    <span class="card__subtasks"
      >{{ completedSubtasksCount }} of {{ totalSubtasksCount }} subtasks</span
    >
  </div>
</article>
