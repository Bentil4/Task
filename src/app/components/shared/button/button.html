<button
  class="btn"
  [class.btn--primary]="variant() === 'primary'"
  [class.btn--danger]="variant() === 'danger'"
  [class.btn--lg]="size() === 'lg'"
  [attr.type]="type()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  (click)="onClick($event)"
>
  <ng-content></ng-content>
</button>
