@if (label()) {
  <label class="select-label" [attr.for]="'select-' + label()">{{ label() }}</label>
}
<div class="select-wrapper">
  <select
    [id]="'select-' + label()"
    class="select-field"
    [value]="value()"
    [required]="required()"
    [disabled]="disabled()"
    [attr.aria-required]="required()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="error() ? getErrorId() : null"
    (change)="onValueChange(($any($event.target)).value)"
  >
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
  <svg class="select-icon" width="10" height="7" xmlns="http://www.w3.org/2000/svg">
    <path stroke="#635FC7" stroke-width="2" fill="none" d="m1 1 4 4 4-4"/>
  </svg>
</div>
@if (error()) {
  <span [id]="getErrorId()" class="error-message" role="alert" aria-live="polite">{{ error() }}</span>
}
