<section class="dialog-overlay" (click)="onCancel()" role="dialog" aria-modal="true" [attr.aria-labelledby]="'dialog-title'">
  <div class="dialog-content" (click)="$event.stopPropagation()">
    <h2 id="dialog-title" class="dialog-title">{{ title() }}</h2>
    <p class="dialog-message">{{ message() }}</p>
    <div class="dialog-actions">
      <button #confirmButton type="button" class="btn-delete" (click)="onConfirm()">
        {{ confirmText() }}
      </button>
      <button type="button" class="btn-cancel" (click)="onCancel()">
        {{ cancelText() }}
      </button>
    </div>
  </div>
</section>
